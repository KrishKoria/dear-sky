# Deploys Dear Sky (Hosting, the lightLantern function, Firestore rules and indexes) on every
# push to main. Keyless: GitHub proves who it is to Google through Workload Identity Federation,
# so no key or secret is stored anywhere. Setup and reasons: DEPLOY.md, research/deploy-cicd.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; never cancel a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIREBASE_PROJECT: hybridai-785bb
  FIREBASE_TOOLS_VERSION: 15.36.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # lets google-github-actions/auth ask GitHub for an OIDC token
    env:
      # The web app's config is public by design (it ships in the JS), so these are
      # repository variables, not secrets.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1 # must come before auth

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4 # the version used locally

      - uses: actions/setup-node@v7.1.0 # bunx runs firebase-tools with Node
        with:
          node-version: 22 # 22.23.0 had an http.Agent bug; setup-node picks the newest 22.x

      - name: Require config
        # Fail early and plainly if a repository variable is missing.
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                   VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID \
                   VITE_FIREBASE_APP_ID VITE_RECAPTCHA_ENTERPRISE_SITE_KEY \
                   GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            if [ -z "${!v}" ]; then echo "::error::repository variable $v is empty"; exit 1; fi
          done
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}

      - name: Install
        run: |
          bun install --frozen-lockfile
          (cd functions && bun install --frozen-lockfile)

      - name: Check and test
        run: |
          bun run check
          bun test

      - name: Build web app
        run: bun run build

      - name: Write functions env (public web config, not committed)
        # functions/src/judge.ts reads these; they are the same values as the web config.
        run: |
          printf 'DEAR_SKY_WEB_API_KEY=%s\nDEAR_SKY_WEB_APP_ID=%s\n' \
            "$VITE_FIREBASE_API_KEY" "$VITE_FIREBASE_APP_ID" \
            > "functions/.env.${FIREBASE_PROJECT}"

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          # Writes a short-lived credentials file and points GOOGLE_APPLICATION_CREDENTIALS at it,
          # which the Firebase CLI picks up.

      - name: Deploy hosting, functions, firestore
        # No --force: it would also auto-confirm deleting functions removed from the code.
        # The Artifact Registry cleanup policy is set once by hand (DEPLOY.md step 6).
        run: >
          bunx --package firebase-tools@${FIREBASE_TOOLS_VERSION} firebase deploy
          --only hosting,functions,firestore
          --project "$FIREBASE_PROJECT"
          --non-interactive
          -m "${GITHUB_SHA}"
